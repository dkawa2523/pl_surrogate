benchmark:
  output_dir: runs/periodic_real_tuned_v83/benchmark_m7_unetpp_isolated_mainline
  profile: m7_unetpp_isolated
  seed: 411
  phi_mode: direct
  eval:
    mask_metrics: plasma_only
    interp_mode: overlap
    protocol_variant: unetpp_isolated_mainline
    target_family_for_score: allvars
    target_vars_for_score: [ne, ni, Te, phi]
    primary_metric: surrogate_quality_score
    objective_mode: min
    region_bands:
      mode: fixed_px
      boundary_in_px: 2.0
      deep_plasma_px: 10.0
      boundary_q: 0.15
      deep_q: 0.70
  eval_protocol:
    mode: dual_axis
    scope: unetpp_isolated
    primary_split: interp
    interp_weight: 0.5
    extrap_weight: 0.5
    frozen_ref_tag: periodic_global_frozen_v2
  dataset:
    type: csv_npz
    root: data/outputs_merged_td_csv_periodic
    index_csv: index.csv
    targets:
      - {id: ne, source_key: ne, value_transform: identity, units: "m^-3", dtype: float32}
      - {id: ni, source_key: ni, value_transform: identity, units: "m^-3", dtype: float32}
      - {id: Te, source_key: Te, value_transform: identity, units: "eV", dtype: float32}
      - {id: phi, source_key: phi, value_transform: identity, units: "V", dtype: float32}
    cond_columns: [PP0, Td, gamma]
    axis_column: axis
    fields_npz_column: fields_npz
    case_id_column: case_id
    base_case_id_column: base_case_id
    split_group_column: split_group
    geometry_root: geometry
  split:
    seed: 7
    ratios: [0.7, 0.15, 0.15]
  preprocessing:
    scalers:
      enforce_target_transforms: true
      y_fit_policy: plasma_only
      target_transforms:
        ne: {value_transform: identity, scaler: zscore, fit_scope: plasma_only, clip: {mode: none}}
        ni: {value_transform: identity, scaler: zscore, fit_scope: plasma_only, clip: {mode: none}}
        Te: {value_transform: identity, scaler: zscore, fit_scope: plasma_only, clip: {mode: none}}
        phi: {value_transform: identity, scaler: zscore, fit_scope: plasma_only, clip: {mode: none}}
    distance_contract:
      require_negative_outside: error
    coord_grid_contract:
      require_requested_source: error
    coord_grid_source: coord_grid
    coord_features:
      enabled: true
      output: features/coord_feature_pack.npz
      channels: [x, y, mask_plasma, distance_signed, distance_any]
      distance_transform_stats:
        enabled: true
        fit_scope: train_split
        mask_scope: plasma_plus_band
        chamber_band_px: 2.0
        signed_quantile: 0.45
        proximity_quantile: 0.25
  train:
    unet_like:
      batch_size_cases: 6
      shuffle_cases: true
    unetpp:
      epochs: 120
      lr: 0.0004
      optimizer:
        type: adamw
        lr: 0.0004
        weight_decay: 0.0001
        betas: [0.9, 0.999]
        eps: 1.0e-8
        schedule: cosine
        warmup_epochs: 5
      target_family: allvars
      target_vars: [ne, ni, Te, phi]
      input_features:
        mode: geom_feature_pack
        features: [x, y, mask_plasma, distance_signed, distance_any]
        distance_transform:
          mode: bounded_auto
          signed_tanh_tau: 8.0
          proximity_tau: 6.0
          replace_distance_any: true
      selection:
        mode: best_val_allvars_balance
        eval_every_n_epochs: 2
        warmup_epochs: 8
        boundary_band_px: 2.0
        boundary_bonus_weight: 0.0
        weights:
          ne: 0.25
          ni: 0.25
          Te: 0.25
          phi: 0.25
      model_cfg:
        backend: torch
        conv_cfg:
          base_channels: 32
          depth: 2
          upsample_mode: bilinear
          nested_skip: true
          deep_supervision:
            enabled: false
        output_heads:
          mode: shared
    loss:
      supervised:
        type: mse
        normalization: sample_mean
        sample_mean_group_mode: batch
        sample_mean_weight_denominator: count
        mask: plasma_only
      multitask:
        weighting: fixed
        fixed_weights_by_var:
          ne: 1.0
          ni: 1.0
          Te: 1.0
          phi: 1.0
  boundary_operator:
    primary_qoi_key: Gamma_i
  physics:
    enabled: false
  inference:
    axis:
      mode: steady
      value: 0.0
