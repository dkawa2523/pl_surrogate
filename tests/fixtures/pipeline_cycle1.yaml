run_dir: tests/fixtures/pipeline_run

dataset:
  type: synthetic
  n_cases: 12
  height: 8
  width: 8
  cond_dim: 3
  seed: 7

preprocessing:
  split:
    seed: 0
    ratios: [0.7, 0.15, 0.15]
  axis_schema:
    mode: steady
    harmonics: 1

model:
  name: global_mlp

train:
  epochs: 5
  lr: 0.01

inference:
  single:
    enabled: true
    cond: {c0: 0.2, c1: 0.5, c2: 0.8}
  batch:
    enabled: true
    conds:
      - {c0: 0.1, c1: 0.2, c2: 0.3}
      - {c0: 0.7, c1: 0.6, c2: 0.5}
  optimize:
    enabled: true
    n_trials: 4
    space:
      c0: [0.0, 1.0]
      c1: [0.0, 1.0]
      c2: [0.0, 1.0]
