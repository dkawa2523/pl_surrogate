benchmark:
  output_dir: runs/icp_stage4_axisymmetric_energy_weighted_v1/uno
  profile: m7_u_no_experimental
  seed: 411
  phi_mode: direct
  eval:
    mask_metrics: plasma_only
    interp_mode: marginal
    protocol_variant: icp_stage4_axisymmetric_energy_weighted_v1_uno
    target_family_for_score: allvars
    target_vars_for_score:
    - ne
    - ni
    - Te
    - phi
    primary_metric: test_r2_group_default_plasma
    objective_mode: min
    region_bands:
      mode: fixed_px
      boundary_in_px: 2.0
      deep_plasma_px: 10.0
    spatial_distribution_audit:
      enabled: true
      vars: all
      top_fraction: 0.1
      plot_worst_cases: 3
      plot_representative_cases: true
    quality_score:
      mode: spatial_huber
      target_aggregation: uniform_by_target
      delta: 1.0
      boundary_alpha: 0.0
      avgpool_lambda: 0.05
      gradient_lambda: 0.1
      multiscale_scales:
      - 2
      - 4
      p90_weight: 0.25
      worst_weight: 0.1
  eval_protocol:
    mode: primary_axis
    scope: u_no_isolated
    primary_split: structure_holdout
    interp_weight: 0.5
    extrap_weight: 0.5
    frozen_ref_tag: periodic_global_frozen_v2
    interp_mode: marginal
    min_primary_test_cases: 3
    min_primary_test_groups: 3
  dataset:
    type: csv_npz
    root: data\outputs_icp_stage4_enriched_360_csv_npz_core4_part_lite_v2
    index_csv: index.csv
    targets:
    - id: ne
      source_key: ne
      value_transform: identity
      units: m^-3
      dtype: float32
    - id: ni
      source_key: ni
      value_transform: identity
      units: m^-3
      dtype: float32
    - id: Te
      source_key: Te
      value_transform: identity
      units: eV
      dtype: float32
    - id: phi
      source_key: phi
      value_transform: identity
      units: V
      dtype: float32
    cond_columns:
    - pp
    - pp0
    axis_column: axis
    fields_npz_column: fields_npz
    case_id_column: case_id
    base_case_id_column: base_case_id
    split_group_column: split_group
    geometry_root: geometry
    structure_npz_column: structure_npz
  split:
    seed: 7
    ratios:
    - 0.8
    - 0.1
    - 0.1
    structure_holdout:
      enabled: true
      required: true
      group_key: base_case_id
  preprocessing:
    scalers:
      enforce_target_transforms: true
      y_fit_policy: plasma_only
      target_transforms:
        ne:
          value_transform: identity
          scaler: zscore
          fit_scope: plasma_only
          clip:
            mode: none
        ni:
          value_transform: identity
          scaler: zscore
          fit_scope: plasma_only
          clip:
            mode: none
        Te:
          value_transform: identity
          scaler: zscore
          fit_scope: plasma_only
          clip:
            mode: none
        phi:
          value_transform: identity
          scaler: zscore
          fit_scope: plasma_only
          clip:
            mode: none
      cond: robust
      fit_split: structure_holdout
    distance_contract:
      require_negative_outside: error
    coord_grid_contract:
      require_requested_source: error
    coord_grid_source: rz_linear
    coord_features:
      enabled: true
      output: features/coord_feature_pack.npz
      distance_transform_stats:
        enabled: true
        fit_scope: train_split
        mask_scope: plasma_plus_band
        chamber_band_px: 2.0
        signed_quantile: 0.45
        proximity_quantile: 0.25
      channels_from_profile: part_source_v1
      static_output: features/static_spatial_feature_pack.npz
      case_structure_output: features/case_structure_feature_pack.npz
      scaling:
        enabled: true
        mode: zscore
        fit_scope: train_split
        mask_scope: plasma_plus_band
      require_case_variation: true
  train:
    unet_like:
      batch_size_cases: 2
      shuffle_cases: true
    loss:
      supervised:
        type: mse
        mask: plasma_only
        nan_region_policy: mask_only
        normalization: sample_mean
        target_weights:
          ne: 1.0
          ni: 1.0
          Te: 1.0
          phi: 1.0
        physical_weighting:
          axisymmetric_volume: true
          density_source: ne
          density_weighted_targets:
          - Te
      multitask:
        weighting: fixed
        fixed_weights_by_var:
          ne: 1.0
          ni: 1.0
          Te: 1.0
          phi: 1.0
    u_no:
      epochs: 70
      lr: 0.0003
      optimizer:
        type: adamw
        lr: 0.0003
        weight_decay: 0.0001
        schedule: cosine
      target_family: allvars
      target_vars:
      - ne
      - ni
      - Te
      - phi
      input_features:
        mode: geom_feature_pack
        features:
        - x
        - y
        - distance_signed
        - part_sdf_union
        - part_source_sum
        require_pack: error
        distance_transform:
          mode: bounded_auto
          signed_tanh_tau: 8.0
          proximity_tau: 6.0
          replace_distance_any: true
      selection:
        mode: best_val_loss
      model_cfg:
        backend: torch
        n_modes: 10
        fno_n_modes: 10
        uno_cfg:
          width: 48
          n_layers: 4
          dropout: 0.0
          padding_fraction: 0.08
          padding_mode: reflect
      batch_size_cases: 2
  boundary_operator:
    primary_qoi_key: Gamma_i
  physics:
    enabled: false
  inference:
    axis:
      mode: steady
      value: 0.0
    ood:
      physics:
        enabled: true
        symbols:
          density: ne
          temperature: Te
          potential: phi
    qoi:
      uniformity:
        target: ne
        preferred_targets:
        - ne
        - ni
        - Te
        region: plasma_mid_height
        mid_height_band_px: 2
    postprocess:
      positive_vars:
      - ne
      - ni
      - Te
      positive_floor: 1.0e-30
    optimize:
      enabled: false
      backend: two_stage
      n_trials: 512
      backend_cfg:
        n_initial: 256
        top_k: 16
        local_trials_per_seed: 16
        local_radius_frac: 0.25
      objective:
        mode: weighted_sum
        terms:
        - key: uniformity
          direction: min
          weight: 1.0
        - key: poisson_residual_norm
          direction: min
          weight: 0.05
          transform: log1p_abs
          scale: 1.0
        - key: boundary_gamma_uniformity
          direction: min
          weight: 0.1
  runtime: &id001
    input_mode: table_plus_structure
    strict_input_mode: error
    structure:
      feature_profile: part_source_v1
      descriptor_profile: none
      latent_profile: none
      adapter_mode: auto
      provider_mode: parametric_parts
  metadata:
    study: icp_axisymmetric_energy_weighted_v1
    variant: relative_spatial_objective
    structure_condition_columns:
    - pp
    - pp0
    comparison_model: u_no_m10_w48_l4_lr3e4
    representation: part_source_v1
    geometry_dimensions_as_conditions: false
    target_space: physical_linear_zscore
    training_objective: axisymmetric_volume_and_electron_energy_weighted_mse
runtime: *id001
