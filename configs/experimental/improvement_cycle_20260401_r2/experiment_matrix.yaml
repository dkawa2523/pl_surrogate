  - id: C7_coord_siren_gated_affine_w0_res
    base_fixture: tests/fixtures/benchmark_periodic_real_m7_coord_mlp_siren_experimental.yaml
    patch:
      benchmark:
        output_dir: runs/improvement_cycle_20260401_r2/C7_coord_siren_gated_affine_w0_res
