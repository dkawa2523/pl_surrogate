experiments:
  - id: C3_coord_siren_control
    base_fixture: tests/fixtures/benchmark_periodic_real_m7_coord_mlp_siren_experimental.yaml
    patch:
      benchmark:
        output_dir: runs/improvement_cycle_20260401_r2/C3_coord_siren_control
        eval:
          protocol_variant: improvement_cycle_r2_c3_coord_control
        train:
          coord_mlp_siren:
            selection:
              weights:
                ne: 0.25
                ni: 0.25
                Te: 0.25
                phi: 0.25
            model_cfg:
              siren:
                fusion: split_add
                w0_initial: 10.0
                w0_hidden: 1.0

