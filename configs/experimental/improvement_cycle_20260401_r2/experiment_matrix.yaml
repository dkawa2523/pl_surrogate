  - id: D10_deeponet_fused_learned_mix
    base_fixture: tests/fixtures/benchmark_periodic_real_m7_deeponet_isolated_mainline.yaml
    patch:
      benchmark:
        output_dir: runs/improvement_cycle_20260401_r2/D10_deeponet_fused_learned_mix
        eval:
          protocol_variant: improvement_cycle_r2_d10_deeponet_fused_learned_mix
        train:
          deeponet_plasma:
            strict_mainline: true
            epochs: 480
            selection:
              weights:
                ne: 0.20
                ni: 0.20
                Te: 0.30
                phi: 0.30
            model_cfg:
              trunk_cond_modulation: none
              missing_geom_feature_policy: error
              output_path:
                mode: fused
                dot_skip_mode: learned_per_var
                global_hidden_dim: 96
                global_local:
                  enabled: true
          loss:
            multitask:
              fixed_weights_by_var:
                ne: 1.0
                ni: 1.0
                Te: 1.20
                phi: 1.20

