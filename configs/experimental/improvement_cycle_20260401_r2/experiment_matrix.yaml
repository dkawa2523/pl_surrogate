                ni: 0.20
                Te: 0.30
                phi: 0.30
            model_cfg:
              siren:
                fusion: gated_affine
                w0_initial: 8.0
                w0_hidden: 0.9
                fusion_cfg:
                  cond_gain_init: 0.8
                  point_gain_init: 1.2
              residual_head:
                init_scale: 0.03
          loss:
            multitask:
              fixed_weights_by_var:
                ne: 1.0
                ni: 1.0
                Te: 1.25
                phi: 1.25

