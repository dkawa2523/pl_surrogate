# Example compare/benchmark planning fragment.
# Merge into an existing benchmark/compare YAML after isolated model smoke tests are green.
# compare is dynamic-target aware.
# Do not assume a fixed key like test_rmse_phi; keep objective_metric=auto_primary unless you need a specific resolved metric.
# global_reference_mode=frozen requires at least one row with model_id=global_mlp.
benchmark:
  profile: m7_periodic_common
  eval:
    target_family_for_score: auto
    target_vars_for_score: auto
    primary_metric: auto_primary
    primary_mode: max

compare:
  global_reference_mode: frozen
  objective_metric: auto_primary
  objective_mode: max
  rows:
    - name: global_mlp
      model_id: global_mlp
      leaderboard_csv: runs/periodic_real_tuned_v48/benchmark_m7_global_frozen_ref_v2/leaderboard.csv
    - name: unetpp
      model_id: unetpp
      leaderboard_csv: runs/periodic_real_tuned_v83/benchmark_m7_unetpp_isolated_mainline/leaderboard.csv
    - name: unetpp_attn
      model_id: unetpp_attn
      leaderboard_csv: runs/periodic_real_tuned_v83/benchmark_m7_unetpp_attn_isolated_mainline/leaderboard.csv
    - name: ffno
      model_id: ffno
      leaderboard_csv: runs/periodic_real_tuned_v83/benchmark_m7_ffno_isolated_mainline/leaderboard.csv
    - name: deeponet_plasma
      model_id: deeponet_plasma
      leaderboard_csv: runs/periodic_real_tuned_v83/benchmark_m7_deeponet_isolated_mainline/leaderboard.csv
    # Experimental rows are allowed in compare, but do not promote them into mainline profile locks.
    - name: coord_mlp_fourier
      model_id: coord_mlp_fourier
      leaderboard_csv: runs/periodic_real_tuned_v83/benchmark_m7_coord_mlp_fourier_experimental/leaderboard.csv
    - name: coord_mlp_siren
      model_id: coord_mlp_siren
      leaderboard_csv: runs/periodic_real_tuned_v83/benchmark_m7_coord_mlp_siren_experimental/leaderboard.csv
    - name: deeponet_pod
      model_id: deeponet_pod
      leaderboard_csv: runs/periodic_real_tuned_v83/benchmark_m7_deeponet_pod_experimental/leaderboard.csv
