# Merge this fragment into an existing pipeline or benchmark YAML.
model:
  name: ffno

train:
  ffno:
    target_family: allvars
    target_vars: [<set-to-output_layout.vars>]
    epochs: 80
    optimizer:
      type: adamw
      schedule: cosine
    input_features:
      mode: geom_feature_pack
      require_pack: error
      features: [x, y, mask_plasma, distance_signed, distance_any]
      distance_transform:
        mode: bounded_auto
    model_cfg:
      n_modes: 12
      spectral_cfg:
        width: 64
        n_layers: 4
        dealias_ratio: 0.85
        taper_alpha: 1.5
        skip_filter: none
        factorized_cfg:
          enabled: true
          mode: separable_1d
          share_weights: false
        local_skip_cfg:
          enabled: true
          init_scale: 0.0
        # Experimental only. Keep disabled for operational FFNO.
        axis_mix_cfg:
          enabled: false
          init_h: 1.0
          init_w: 1.0
    selection:
      mode: best_val_allvars_balance
