# Merge this fragment into an existing pipeline or benchmark YAML.
model:
  name: deeponet_pod

train:
  deeponet_pod:
    target_family: allvars
    target_vars: [<set-to-output_layout.vars>]
    epochs: 120
    optimizer:
      type: adamw
      schedule: cosine
    model_cfg:
      hidden_dim: 128
      latent_dim: 128
      basis:
        rank: 32
        fit_scope: train_only
        per_var: true
        center: true
    selection:
      mode: best_val_allvars_balance
