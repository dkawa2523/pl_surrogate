benchmark:
  output_dir: runs/gec_ccp_trustworthy_v1/n54/geom_deeponet_siren
  profile: m7_geom_deeponet_siren_experimental
  seed: 411
  phi_mode: direct
  eval:
    mask_metrics: plasma_only
    interp_mode: overlap
    protocol_variant: geom_deeponet_siren_gec_ccp_trustworthy_v1_n54
    target_family_for_score: allvars
    target_vars_for_score:
    - ne
    - ni
    - Te
    - phi
    primary_metric: surrogate_quality_score
    objective_mode: min
    region_bands:
      mode: fixed_px
      boundary_in_px: 2.0
      deep_plasma_px: 10.0
  eval_protocol:
    mode: dual_axis
    scope: geom_deeponet_siren_isolated
    primary_split: interp
    interp_weight: 0.5
    extrap_weight: 0.5
    frozen_ref_tag: periodic_global_frozen_v2
    interp_mode: overlap
  dataset:
    type: csv_npz
    root: data/outputs_merged_td_csv_periodic_ext0520
    index_csv: index_54.csv
    targets:
    - id: ne
      source_key: ne
      value_transform: identity
      units: m^-3
      dtype: float32
      role: density_electron
      positive: true
      field_family: density
      default_region: plasma_only
    - id: ni
      source_key: ni
      value_transform: identity
      units: m^-3
      dtype: float32
      role: density_ion
      positive: true
      field_family: density
      default_region: plasma_only
    - id: Te
      source_key: Te
      value_transform: identity
      units: eV
      dtype: float32
      role: temperature_electron
      positive: true
      field_family: temperature
      default_region: plasma_only
    - id: phi
      source_key: phi
      value_transform: identity
      units: V
      dtype: float32
      role: potential
      positive: false
      field_family: electrostatic
      default_region: plasma_only
    cond_columns:
    - PP0
    - Td
    - gamma
    axis_column: axis
    fields_npz_column: fields_npz
    case_id_column: case_id
    base_case_id_column: base_case_id
    split_group_column: split_group
    geometry_root: geometry
  split:
    seed: 7
    ratios:
    - 0.7
    - 0.15
    - 0.15
  preprocessing:
    scalers:
      enforce_target_transforms: true
      y_fit_policy: plasma_only
      target_transforms:
        ne:
          value_transform: identity
          scaler: zscore
          fit_scope: plasma_only
          clip:
            mode: none
        ni:
          value_transform: identity
          scaler: zscore
          fit_scope: plasma_only
          clip:
            mode: none
        Te:
          value_transform: identity
          scaler: zscore
          fit_scope: plasma_only
          clip:
            mode: none
        phi:
          value_transform: identity
          scaler: zscore
          fit_scope: plasma_only
          clip:
            mode: none
    distance_contract:
      require_negative_outside: error
    coord_grid_contract:
      require_requested_source: false
    coord_grid_source: coord_grid
    coord_features:
      enabled: true
      output: features/coord_feature_pack.npz
      distance_transform_stats:
        enabled: true
        fit_scope: train_split
        mask_scope: plasma_plus_band
        chamber_band_px: 2.0
        signed_quantile: 0.45
        proximity_quantile: 0.25
      channels_from_profile: geom_v1_mainline
  train:
    unet_like:
      batch_size_cases: 6
      shuffle_cases: true
    geom_deeponet_siren:
      epochs: 120
      lr: 0.0004
      optimizer:
        type: adamw
        lr: 0.0004
        weight_decay: 0.0001
        betas:
        - 0.9
        - 0.999
        eps: 1.0e-08
        schedule: cosine
        warmup_epochs: 5
      target_family: allvars
      target_vars:
      - ne
      - ni
      - Te
      - phi
      input_features:
        mode: geom_feature_pack
        require_pack: error
        features:
        - x
        - y
        - mask_plasma
        - distance_signed
        - distance_any
        distance_transform:
          mode: bounded_auto
          signed_tanh_tau: 8.0
          proximity_tau: 6.0
          replace_distance_any: true
      selection:
        mode: best_val_allvars_balance
        eval_every_n_epochs: 2
        warmup_epochs: 8
        weights:
          ne: 0.25
          ni: 0.25
          Te: 0.25
          phi: 0.25
      model_cfg:
        backend: torch
        geom_deeponet_siren_cfg:
          latent_dim: 64
          trunk_hidden: 96
          trunk_layers: 3
          branch_hidden: 128
          branch_layers: 2
          dropout: 0.0
          trunk_w0: 20.0
    loss:
      supervised:
        type: mse
        mask: plasma_only
  boundary_operator:
    primary_qoi_key: Gamma_i
  physics:
    enabled: false
  inference:
    axis:
      mode: steady
      value: 0.0
    ood:
      physics:
        enabled: true
        symbols:
          density: ne
          temperature: Te
          potential: phi
  runtime:
    input_mode: table_plus_structure
    structure:
      feature_profile: geom_v1_mainline
      descriptor_profile: struct_desc_v1
      latent_profile: none
      adapter_mode: auto
      provider_mode: parametric_parts
runtime:
  input_mode: table_plus_structure
  structure:
    feature_profile: geom_v1_mainline
    descriptor_profile: struct_desc_v1
    latent_profile: none
    adapter_mode: auto
    provider_mode: parametric_parts
