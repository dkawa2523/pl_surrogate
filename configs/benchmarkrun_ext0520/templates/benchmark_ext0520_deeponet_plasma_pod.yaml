benchmark:
  output_dir: runs/benchmarkrun_ext0520/n54/deeponet_plasma_pod
  profile: m7_deeponet_plasma_pod
  seed: 511
  phi_mode: direct
  eval:
    mask_metrics: plasma_only
    interp_mode: overlap
    protocol_variant: deeponet_plasma_pod_benchmarkrun_ext0520_n54
    target_family_for_score: allvars
    target_vars_for_score:
    - ne
    - ni
    - Te
    - phi
    primary_metric: test_r2_plasma_mean_dual
    primary_mode: max
    aggregate_score:
      enabled: true
      rmse_weight: 0.5
      r2_weight: 0.4
      boundary_penalty_weight: 0.1
      use_plasma_metrics: true
    region_bands:
      mode: fixed_px
      boundary_in_px: 2.0
      deep_plasma_px: 10.0
      boundary_q: 0.15
      deep_q: 0.7
  eval_protocol:
    mode: dual_axis
    scope: common
    primary_split: interp
    interp_weight: 0.5
    extrap_weight: 0.5
    frozen_ref_tag: periodic_global_frozen_v2
  dataset:
    type: csv_npz
    root: data/outputs_merged_td_csv_periodic_ext0520
    index_csv: index_54.csv
    targets:
    - id: ne
      source_key: log_ne
      value_transform: pow10
      units: m^-3
      dtype: float32
    - id: ni
      source_key: log_ni
      value_transform: pow10
      units: m^-3
      dtype: float32
    - id: Te
      source_key: Te
      value_transform: identity
      units: eV
      dtype: float32
    - id: phi
      source_key: phi
      value_transform: identity
      units: V
      dtype: float32
    cond_columns:
    - PP0
    - Td
    - gamma
    axis_column: axis
    fields_npz_column: fields_npz
    case_id_column: case_id
    base_case_id_column: base_case_id
    split_group_column: split_group
    geometry_root: geometry
  split:
    seed: 7
    ratios:
    - 0.7
    - 0.15
    - 0.15
  preprocessing:
    scalers:
      enforce_target_transforms: true
      y_fit_policy: plasma_only
      target_transforms:
        ne:
          value_transform: identity
          scaler: zscore
          fit_scope: plasma_only
          clip:
            mode: none
        ni:
          value_transform: identity
          scaler: zscore
          fit_scope: plasma_only
          clip:
            mode: none
        Te:
          value_transform: identity
          scaler: zscore
          fit_scope: plasma_only
          clip:
            mode: none
        phi:
          value_transform: identity
          scaler: zscore
          fit_scope: plasma_only
          clip:
            mode: none
    distance_contract:
      require_negative_outside: error
    coord_grid_contract:
      require_requested_source: warn
    coord_grid_source: coord_grid
  train:
    unet_like:
      batch_size_cases: 4
      shuffle_cases: true
    deeponet_plasma_pod:
      epochs: 120
      lr: 0.0003
      target_family: allvars
      target_vars:
      - ne
      - ni
      - Te
      - phi
      optimizer:
        type: adamw
        schedule: cosine
        warmup_epochs: 10
      selection:
        mode: best_val_allvars_balance
      model_cfg:
        hidden_dim: 128
        latent_dim: 128
        coeff_loss_weight: 0.1
        basis:
          rank: 32
          fit_scope: train_only
          per_var: true
          center: true
  physics:
    enabled: false
  inference:
    axis:
      mode: steady
      value: 0.0
  runtime:
    input_mode: table_only
    strict_input_mode: error
    allow_mode_fallback: false
    structure:
      feature_profile: none
      descriptor_profile: none
      latent_profile: none
      adapter_mode: none
      provider_mode: fixed
runtime:
  input_mode: table_only
  strict_input_mode: error
  allow_mode_fallback: false
  structure:
    feature_profile: none
    descriptor_profile: none
    latent_profile: none
    adapter_mode: none
