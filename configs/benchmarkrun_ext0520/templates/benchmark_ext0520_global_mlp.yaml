benchmark:
  output_dir: runs/gec_ccp_trustworthy_v1/n54/global_mlp
  profile: m7_global_frozen_ref
  seed: 411
  phi_mode: direct
  eval:
    mask_metrics: plasma_only
    interp_mode: overlap
    protocol_variant: global_mlp_gec_ccp_trustworthy_v1_n54
    target_vars_for_score:
    - ne
    - ni
    - Te
    - phi
    primary_metric: surrogate_quality_score
    objective_mode: min
    target_family_for_score: allvars
    region_bands:
      mode: fixed_px
      boundary_in_px: 2.0
      deep_plasma_px: 10.0
  eval_protocol:
    mode: dual_axis
    scope: global_frozen
    primary_split: interp
    interp_weight: 0.5
    extrap_weight: 0.5
    frozen_ref_tag: periodic_global_frozen_v2
    interp_mode: overlap
  dataset:
    type: csv_npz
    root: data/outputs_merged_td_csv_periodic_ext0520
    index_csv: index_54.csv
    targets:
    - id: ne
      source_key: ne
      value_transform: identity
      units: m^-3
      dtype: float32
      role: density_electron
      positive: true
      field_family: density
      default_region: plasma_only
    - id: ni
      source_key: ni
      value_transform: identity
      units: m^-3
      dtype: float32
      role: density_ion
      positive: true
      field_family: density
      default_region: plasma_only
    - id: Te
      source_key: Te
      value_transform: identity
      units: eV
      dtype: float32
      role: temperature_electron
      positive: true
      field_family: temperature
      default_region: plasma_only
    - id: phi
      source_key: phi
      value_transform: identity
      units: V
      dtype: float32
      role: potential
      positive: false
      field_family: electrostatic
      default_region: plasma_only
    cond_columns:
    - PP0
    - Td
    - gamma
    axis_column: axis
    fields_npz_column: fields_npz
    case_id_column: case_id
    base_case_id_column: base_case_id
    split_group_column: split_group
    geometry_root: geometry
  split:
    seed: 7
    ratios:
    - 0.7
    - 0.15
    - 0.15
  preprocessing:
    scalers:
      enforce_target_transforms: true
      y_fit_policy: plasma_only
      target_transforms:
        ne:
          value_transform: identity
          scaler: zscore
          fit_scope: plasma_only
          clip:
            mode: none
        ni:
          value_transform: identity
          scaler: zscore
          fit_scope: plasma_only
          clip:
            mode: none
        Te:
          value_transform: identity
          scaler: zscore
          fit_scope: plasma_only
          clip:
            mode: none
        phi:
          value_transform: identity
          scaler: zscore
          fit_scope: plasma_only
          clip:
            mode: none
    distance_contract:
      require_negative_outside: error
    coord_grid_contract:
      require_requested_source: false
    coord_grid_source: coord_grid
  train:
    global_mlp:
      epochs: 80
      lr: 0.0008
      batch_size_cases: 6
      shuffle_cases: true
      grad_scale:
        mode: auto
        auto_ref: active_pixels
        auto_power: 0.5
      layer_lr_multiplier:
        hidden: 1.0
        output: 20.0
      grad_clip:
        mode: per_sample
        norm: 1.0
        adaptive_by_dim: true
      output_head_refresh:
        enabled: true
        every_n_epochs: 5
        ridge: 0.0001
      model_cfg:
        hidden:
        - 128
        - 128
        dropout: 0.0
        weight_decay: 0.0
    loss:
      supervised:
        type: mse
        mask: plasma_only
  boundary_operator:
    primary_qoi_key: Gamma_i
  physics:
    enabled: false
  inference:
    axis:
      mode: steady
      value: 0.0
    ood:
      physics:
        enabled: true
        symbols:
          density: ne
          temperature: Te
          potential: phi
  runtime:
    input_mode: table_only
    structure:
      feature_profile: none
      descriptor_profile: none
      latent_profile: none
      adapter_mode: none
      provider_mode: fixed
runtime:
  input_mode: table_only
  structure:
    feature_profile: none
    descriptor_profile: none
    latent_profile: none
    adapter_mode: none
    provider_mode: fixed
